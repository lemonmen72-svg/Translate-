name: Сборка APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# Сборки на одной ветке кладут APK в один и тот же релиз через --clobber, и
# параллельные прогоны затирали бы друг друга. Актуальна всегда последняя, так
# что устаревшие отменяем.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Разведка: печатает реальные имена ассетов релизов sherpa-onnx.
  # Локально это не проверить — dl.google.com и huggingface.co закрыты
  # политикой сети среды разработки.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ассеты релизов sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/probe_assets.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Скачать AAR sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_sherpa.py

      # Лог Gradle со стектрейсами разрастается до тысяч строк, и строки с
      # ошибками компиляции тонут в середине. Складываем вывод в файл и на
      # неудаче печатаем только их.
      - name: Собрать debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===================== ОШИБКИ КОМПИЛЯЦИИ ====================="
            grep -E "^e: |^w: .*error|error:|Unresolved reference|Type mismatch" build.log \
              | head -60 || true
            echo "===================== КОНЕЦ ================================"
          fi
          exit $status

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OverlayTranslator-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          if-no-files-found: error

      # Дублируем APK в релиз: артефакты Actions раздаются с хоста
      # *.blob.core.windows.net, а он закрыт политикой сети среды разработки —
      # оттуда файл не скачать. Ассеты релизов лежат на доступном хосте.
      - name: Опубликовать APK релизом
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apk-latest
          notes="Debug-сборка из коммита ${GITHUB_SHA::8}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.apk --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" out/*.apk \
              --title "Последняя сборка APK" --notes "$notes"
          fi
