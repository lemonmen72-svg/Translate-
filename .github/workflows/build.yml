name: Сборка APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # Разведка: печатает реальные имена ассетов релизов sherpa-onnx.
  # Локально это не проверить — dl.google.com и huggingface.co закрыты
  # политикой сети среды разработки.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ассеты релизов sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/probe_assets.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Скачать AAR sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_sherpa.py

      - name: Собрать debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OverlayTranslator-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          if-no-files-found: error
