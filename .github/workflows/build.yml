name: Сборка APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# Сборки на одной ветке кладут APK в один и тот же релиз через --clobber, и
# параллельные прогоны затирали бы друг друга. Актуальна всегда последняя, так
# что устаревшие отменяем.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Разведка: печатает реальные имена ассетов релизов sherpa-onnx.
  # Локально это не проверить — dl.google.com и huggingface.co закрыты
  # политикой сети среды разработки.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ассеты релизов sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/probe_assets.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Скачать AAR sherpa-onnx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_sherpa.py

      # Лог Gradle со стектрейсами разрастается до тысяч строк, и строки с
      # ошибками компиляции тонут в середине. Складываем вывод в файл и на
      # неудаче печатаем только их.
      - name: Собрать debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===================== ОШИБКИ КОМПИЛЯЦИИ ====================="
            grep -E "^e: |^w: .*error|error:|Unresolved reference|Type mismatch" build.log \
              | head -60 || true
            echo "===================== КОНЕЦ ================================"
          fi
          exit $status

      # Версия попадает в имя файла: по присланному APK должно быть видно, что
      # в нём собрано, без установки и без сверки хешей.
      # Проверяем подпись до публикации: битую или неполную подпись видно только
      # на устройстве, где ошибка выглядит как «Приложение не установлено» без
      # объяснения причины.
      - name: Проверить подпись APK
        run: |
          sudo apt-get install -y -qq apksigner
          apksigner verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Переименовать APK с версией
        id: apk
        run: |
          eval "$(./gradlew -q :app:printVersion | grep -E '^VERSION_(NAME|CODE)=')"
          name="OverlayTranslator-${VERSION_NAME}-build${VERSION_CODE}-${GITHUB_SHA::8}.apk"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          if-no-files-found: error

      # Дублируем APK в релиз: артефакты Actions раздаются с хоста
      # *.blob.core.windows.net, а он закрыт политикой сети среды разработки —
      # оттуда файл не скачать. Ассеты релизов лежат на доступном хосте.
      - name: Опубликовать APK релизом
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apk-latest
          version="${{ steps.apk.outputs.version }}"
          code="${{ steps.apk.outputs.code }}"
          notes="Версия $version (сборка $code), коммит ${GITHUB_SHA::8}."
          if gh release view "$tag" >/dev/null 2>&1; then
            # Имя файла теперь содержит версию, поэтому старые APK не
            # перезаписываются сами по себе — удаляем их, чтобы в релизе всегда
            # лежала ровно одна актуальная сборка.
            gh release view "$tag" --json assets \
              --jq '.assets[].name | select(endswith(".apk"))' \
              | while read -r old; do
                  [ "$old" = "${{ steps.apk.outputs.name }}" ] && continue
                  echo "удаляю старый ассет $old"
                  gh release delete-asset "$tag" "$old" --yes || true
                done
            gh release upload "$tag" out/*.apk --clobber
            gh release edit "$tag" --title "APK $version" --notes "$notes"
          else
            gh release create "$tag" out/*.apk \
              --title "APK $version" --notes "$notes"
          fi
